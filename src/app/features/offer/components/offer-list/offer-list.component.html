<h4>Offer List</h4>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card mb-4">
  <h3 class="text-lg font-semibold mb-3">Filter Offers</h3>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

    <div class="field">
      <label class="block mb-2">Department</label>
      <p-multiSelect 
      [options]="departmentOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="selectedDepartments"
      placeholder="Select Departments"
      class="w-full"
    ></p-multiSelect>
    </div>

    <div class="field">
      <label class="block mb-2">Type</label>
      <p-multiSelect
      [options]="typeOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="selectedTypes"
      placeholder="Select Types"
      class="w-full"
    ></p-multiSelect>
    
    </div>

    <div class="field">
      <label class="block mb-2">Status</label>
      <p-dropdown
        [options]="statusOptions"
        [(ngModel)]="selectedStatut"
        placeholder="Select Status"
        class="w-full"
      ></p-dropdown>
    </div>
  </div>

  <div class="flex justify-end mt-4">
    <p-button 
      label="Reset"
      icon="pi pi-times"
      styleClass="p-button-outlined p-button-danger mr-2"
      (click)="resetFilters()"
    ></p-button>
    <p-button 

      label="Apply Filters"
      icon="pi pi-filter"
      (click)="applyAllFilters()"

    ></p-button>
  </div>
</div>

<p-table #dt1 
  [value]="filteredOffers" 
  [paginator]="true" 
  [rows]="5" 
  responsiveLayout="scroll"
>
  <ng-template pTemplate="caption">
    <div class="flex items-center gap-4 w-full">
      <p-button 
        label="Clear" 
        [outlined]="true" 
        icon="pi pi-filter-slash" 
        (click)="clear(dt1)" 
      ></p-button>

      <span class="inline-flex p-input-icon-left ml-auto w-full max-w-sm">
        <i class="pi pi-search my-3 text-lg"></i>
        <input 
          pInputText 
          type="text" 
          placeholder="Search offers..." 
          [(ngModel)]="searchQuery" 
          (input)="onSearch()"
          class="border rounded-lg h-12 px-3 py-3 w-full mx-3"
        />
      </span>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th style="width: 15%;">Title</th>
      <th style="width: 25%;">Description</th>
      <th>Type</th>
      <th>Department</th>
      <th>Posted On</th>
      <th>Status</th>
      <th style="width: 15%;">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-offer>
    <tr>
      <td>{{ offer.titre }}</td>
      <td class="p-text-truncate">{{ offer.description }}</td>
      <td>{{ offer.type }}</td>
      <td>{{ offer.department }}</td>
      <td>{{ offer.createdAt | date: 'yyyy-MM-dd' }}</td>
      <td>
        <span 
          class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
          [ngClass]="{
            'bg-green-100 text-green-800': offer.status === 'Open',
            'bg-red-100 text-red-800': offer.status === 'Closed',
            'bg-yellow-100 text-yellow-800': offer.status === 'Pending'
          }"
        >
          <i 
            class="pi mr-2"
            [ngClass]="{
              'pi-check-circle': offer.status === 'Open',
              'pi-times-circle': offer.status === 'Closed',
              'pi-clock': offer.status === 'Pending'
            }"
          ></i>
          {{ offer.status }}
        </span>
      </td>
      
      <td class="p-text-center">
        <div class="p-d-flex p-jc-center p-gap-2">
          <button 
            pButton 
            type="button" 
            icon="pi pi-eye" 
            class="p-button-rounded p-button-text p-button-info" 
            pTooltip="View Details" 
            tooltipPosition="top"
            (click)="goToDetails(offer.id)"
          ></button>
          <button 
            pButton 
            type="button" 
            icon="pi pi-pencil" 
            class="p-button-rounded p-button-text p-button-warning" 
            pTooltip="Edit Offer" 
            tooltipPosition="top"
            (click)="openEditOffer(offer)"
          ></button>
          <button 
            pButton 
            type="button" 
            icon="pi pi-trash" 
            class="p-button-rounded p-button-text p-button-danger" 
            pTooltip="Delete Offer" 
            tooltipPosition="top"
            (click)="deleteOffer(offer.id)"
          ></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

<router-outlet></router-outlet>
