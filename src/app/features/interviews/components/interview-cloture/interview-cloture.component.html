<ng-container >
    <div class="flex items-center justify-center min-h-screen bg-gradient-to-b from-[#e0f7fa] to-white px-6 py-12"
        [@fadeIn]>
        <p-card styleClass="w-full max-w-4xl shadow-2xl rounded-3xl border border-gray-200 bg-white p-8">
            <ng-template pTemplate="header">
                <div class="flex flex-col items-center justify-center gap-4">
                    <div class="animate-bounce">
                        <i class="pi pi-check-circle text-green-500" style="font-size: 70px"></i>
                    </div>
                    <h2 class="text-5xl font-bold text-gray-800">Thank You!</h2>
                </div>
            </ng-template>

            <ng-template pTemplate="content">
                <div class="text-center space-y-6 text-gray-700 px-10">
                    <p class="text-2xl font-semibold">You’ve successfully completed your interview.</p>
                    <p class="text-lg">Your answers have been recorded and submitted for evaluation.</p>
                    <p class="text-lg">You’ll receive your results via email shortly. We appreciate your time and
                        effort!</p>

                    <p-divider class="my-6"></p-divider>

                    <div class="flex flex-col items-center gap-2">
                        <i class="pi pi-envelope text-blue-500 text-4xl"></i>
                        <p class="text-base text-gray-500 italic">Watch your inbox for updates.</p>
                    </div>
                </div>
            </ng-template>
        </p-card>
    </div>
</ng-container>
