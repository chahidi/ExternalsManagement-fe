@if (isLoading$ | async) {
<app-loader [message]="loadingMessage$ | async" [withOverlay]="true"></app-loader>
}
<p-toast></p-toast>


<div class="p-4">
    <h2 class="text-xl font-bold mb-4">Interview List</h2>

    <!-- Filter Panel -->
    <div class="card mb-4">
        <h3 class="text-lg font-semibold mb-3">Filter Interviews</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="field">
                <label for="mainTech" class="block mb-2">Main Tech</label>
                <p-select id="mainTech" [options]="techOptions" [(ngModel)]="mainTechFilter" placeholder="Select Tech"
                    [style]="{ width: '100%' }"></p-select>
            </div>
            <div class="field">
                <label for="title" class="block mb-2">Title</label>
                <p-select id="title" [options]="titleOptions" [(ngModel)]="titleFilter" placeholder="Select Title"
                    [style]="{ width: '100%' }"></p-select>
            </div>
            <div class="field">
                <label for="scheduledDate" class="block mb-2">Scheduled Date</label>
                <p-datepicker id="scheduledDate" [(ngModel)]="scheduledDateFilter" dateFormat="yy-mm-dd" showIcon="true"
                    [style]="{ width: '100%' }" inputStyleClass="w-full"></p-datepicker>
            </div>
        </div>
        <div class="flex justify-end mt-4">
            <p-button label="Reset" icon="pi pi-times" class="p-button-outlined p-button-danger mr-2"
                (click)="resetFilters()"></p-button>
            <p-button label="Apply Filters" icon="pi pi-search" (click)="applyFilters()"></p-button>
        </div>
    </div>

    <!-- Interview Table -->
    <p-table #dt [value]="filteredInterviews" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]"
        [globalFilterFields]="['candidate.fullName', 'candidate.mainTech', 'offer.title', 'comment']"
        responsiveLayout="scroll">
        <ng-template pTemplate="caption">
            <div class="flex justify-between items-center">
                <span class="font-semibold">Interview List</span>
                <div class="flex items-center gap-2">
                    <p-button icon="pi pi-filter-slash" class="p-button-sm" label="Clear Filters"
                        (click)="dt.clear()"></p-button>
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th>
                    <button type="button" pButton
                        [icon]="candidateNameSortAsc ? 'pi pi-sort-alt' : 'pi pi-sort-alt pi-flip'"
                        class="p-button-text p-button-sm ml-1" (click)="sortInterviewsByCandidateName()">
                        Candidate Name
                        <p-columnFilter field="candidate.fullName" matchMode="contains" display="menu"></p-columnFilter>
                </th>
                <th>
                    <button type="button" pButton
                        [icon]="candidateNameSortAsc ? 'pi pi-sort-alt' : 'pi pi-sort-alt pi-flip'"
                        class="p-button-text p-button-sm ml-1" (click)="sortInterviewsByCandidateMainTech()">
                        Main Tech
                        <p-columnFilter field="candidate.mainTech" matchMode="contains" display="menu"></p-columnFilter>
                </th>
                <th>
                    <button type="button" pButton
                        [icon]="candidateNameSortAsc ? 'pi pi-sort-alt' : 'pi pi-sort-alt pi-flip'"
                        class="p-button-text p-button-sm ml-1" (click)="sortInterviewsByOfferTitle()">
                        Title
                        <p-columnFilter field="offer.title" matchMode="contains" display="menu"></p-columnFilter>
                </th>
                <th>
                    Comment
                    <p-columnFilter field="comment" matchMode="contains" display="menu"></p-columnFilter>
                </th>
                <th>
                    Scheduled On
                    <p-columnFilter field="scheduledAt" matchMode="equals" display="menu" [showOperator]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <input type="date" class="p-inputtext p-component w-full" [ngModel]="value"
                                (ngModelChange)="filter($event)" />
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th>Passed On</th>
                <th>Remaining Time</th>
                <th>Duration</th>
                <th>Evaluation</th>
                <th>Recording Link</th>
                <th>Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-interview>
            <tr>
                <td>{{ interview.candidateFullName }}</td>
                <td>{{ interview.candidateMainTech || 'N/A' }}</td>
                <td>{{ interview.offerTitle || 'N/A' }}</td>
                <td>{{ interview.comment || 'N/A' }}</td>
                <td>{{ interview.scheduledAt | date: 'dd-MM-yyyy' }}</td>
                <td>{{ interview.endTime ? (interview.endTime | date: 'dd-MM-yyyy') : '—' }}</td>
                <td>{{ getRemainingHours(interview.scheduledAt) }}</td>
                <td>{{ getDurationLabel(interview) }}</td>

                <td>
                    @if (shouldShowEvaluation(interview)) {
                    <a (click)="openEvaluation(interview)" class="text-blue-600 underline cursor-pointer"> View
                        Evaluation </a>
                    } @else {
                    <span class="text-gray-400 italic">N/A</span>
                    }
                </td>
                <td>
                    @if (interview.record?.fileUrl) {
                    <a [href]="interview.record.fileUrl" target="_blank" class="text-blue-600 underline">View
                        Recording</a>
                    }
                    @if (!interview.record?.fileUrl) {
                    <span class="text-gray-400 italic">Not Available</span>
                    }
                </td>
                <td class="flex gap-1">
                    <button pButton icon="pi pi-refresh" class="p-button-sm p-button-text"
                        [pTooltip]="'Generate New Link'" tooltipPosition="top"
                        (click)="generateLinkAndSendEmail(interview)"></button>
                    <button pButton icon="pi pi-comment" class="p-button-sm p-button-text" pTooltip="Add Comment"
                        (click)="AddCommentPopup(interview)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-sm p-button-danger p-button-text"
                        (click)="confirmDelete(interview)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Add Comment Dialog -->
    <p-dialog header="Add Comment" [(visible)]="showCommentDialog" [modal]="true" [style]="{ width: '500px' }"
        [dismissableMask]="true">
        <div class="p-fluid p-3">
            <div class="field mb-3">
                <label for="comment" class="font-semibold block mb-2">Comment:</label>
                <textarea id="comment" pInputTextarea [(ngModel)]="tempComment" rows="6" autoResize="true"
                    class="p-inputtext w-full border border-gray-300 rounded"
                    placeholder="Enter your comment here..."></textarea>
            </div>
        </div>

        <ng-template pTemplate="footer">
            <div class="flex justify-end gap-2 px-3 pb-3">
                <button pButton label="Close" class="p-button-secondary" (click)="showCommentDialog = false"></button>
                <button pButton label="Save" class="p-button-primary" (click)="saveComment()"></button>
            </div>
        </ng-template>
    </p-dialog>
</div>
