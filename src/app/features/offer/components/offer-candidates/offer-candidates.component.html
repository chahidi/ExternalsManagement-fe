@if (isLoading$ | async) {
  <app-loader [message]="loadingMessage$ | async" [withOverlay]="true"></app-loader>
}
<div class="offer-container"> 
  <p-card class="shadow-md rounded-2xl border border-gray-200 p-6 mb-6 transition hover:shadow-lg">
    <div class="flex flex-col w-full px-4">

      <div class="flex items-center mb-6">
        <i class="pi pi-list text-6xl mr-5 text-primary"></i>
        <span class="font-bold text-3xl title">Passed Candidates</span>
      </div>

      <p-table
        #dt
        [value]="candidates"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 20, 50]"
        [globalFilterFields]="['fullName']"
        responsiveLayout="scroll"
        class="no-borders">

        <ng-template pTemplate="caption">
          <div class="flex">
            <p-button 
              label="Clear" 
              [outlined]="true" 
              icon="pi pi-filter-slash" 
              (click)="dt.clear()">
            </p-button>
            <div class="ml-auto flex items-center gap-2">
              <i class="pi pi-search"></i>
              <input
                pInputText
                type="text"
                placeholder="Search by name..."
                (input)="onGlobalFilter($event, dt)"
                class="border rounded-md h-10 px-3 w-full">
            </div>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th>
              <div class="flex items-center cursor-pointer" >
               
                Full Name
              </div>
            </th>

            <th *ngFor="let evalType of displayedColumns" >
              <div class="flex items-center cursor-pointer" (click)="sortByEvaluationType(evalType)">
                <span class="inline-block px-2 py-1 text-xs rounded mr-1"
                [ngClass]="' text-blue-400'"
                [pTooltip]="'Sort ' + evalType">
                  <i class="pi" 
                     [ngClass]="sortStates[evalType] ? 'pi-arrow-up' : 'pi-arrow-down'">
                  </i>
                </span>
                {{ evalType }}
              </div>
            </th>

            
            <th>Actions</th> 
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-candidate>
          <tr>
            <td>
              <span class="font-semibold">{{ candidate.fullName }}</span>
            </td>

            <td *ngFor="let evalType of displayedColumns" class="text-center" class="score-td">
              <span *ngIf="candidate.evaluationScores[evalType] !== null && candidate.evaluationScores[evalType] !== undefined; else notEvaluated"
                    class="score-badge">
                {{ candidate.evaluationScores[evalType].toFixed(2) }}
              </span>
              <ng-template #notEvaluated>
                <span class="text-gray-400">N/A</span>
              </ng-template>
            </td>


            
            
            <td class="flex gap-2">
              
                <button pButton icon="pi pi-eye"
                        class="p-button-sm p-button-text p-button-info"
                        pTooltip="Convocate for Final Interview" tooltipPosition="top"
                        (click)="openEvaluation(candidate)"
                        ></button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td [attr.colspan]="displayedColumns.length + 4" 
                class="text-center text-gray-500 py-8">
              <i class="pi pi-info-circle text-4xl mb-3 block"></i>
              <p>No candidates have passed the interview for this offer yet.</p>
            </td>
          </tr>
        </ng-template>
      </p-table>

    </div>
  </p-card>
</div>
