@if (isLoading$ | async) {
<app-loader
    [message]="loadingMessage$ | async"
    [withOverlay]="true"
></app-loader>
}
<p-toast></p-toast>
<p-dialog header="Update Prompt" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '50vw' }" [contentStyle]="{ 'overflow-y': 'auto' }">
    <form *ngIf="dialogVisible" class="form-layout">
        <div class="form-field">
            <label for="promptCode">Prompt Code</label>
            <input type="text" id="promptCode" pInputText [(ngModel)]="selectedPrompt.promptCode" name="promptCode"/>
        </div>

        <div class="form-field">
            <label for="promptDesc">Text (Required)</label>
            <textarea id="promptDesc" pInputTextarea rows="4" [(ngModel)]="selectedPrompt.promptDesc" name="promptDesc" required></textarea>
        </div>

        <div class="form-field">
            <label for="schema">Schema (JSON)</label>
            <textarea id="schema" pInputTextarea rows="6" [(ngModel)]="selectedPrompt.schema" name="schema"></textarea>
        </div>

        <div class="form-footer">
            <p-button icon="pi pi-times" label="Cancel" (click)="dialogVisible = false" styleClass="p-button-text"></p-button>
            <button pButton type="button" label="Update" class="p-button-info" (click)="confirmUpdate()"></button>
        </div>
    </form>
</p-dialog>
<p-confirmdialog #cd>
    <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
        <div class="flex flex-col items-center p-8 bg-surface-0 dark:bg-surface-900 rounded">
            <div
                class="rounded-full bg-primary text-primary-contrast inline-flex justify-center items-center h-24 w-24 -mt-20"
            >
                <i class="pi pi-question !text-5xl"></i>
            </div>
            <span class="font-bold text-2xl block mb-2 mt-6">{{ message.header }}</span>
            <p class="mb-0">{{ message.message }}</p>
            <div class="flex items-center gap-2 mt-6">
                <p-button label="Yes" (onClick)="onAccept()" styleClass="w-32"></p-button>
                <p-button label="No" [outlined]="true" (onClick)="onReject()" styleClass="w-32"></p-button>
            </div>
        </div>
    </ng-template>
</p-confirmdialog>

<h3>Prompt List</h3>

<p-table [value]="prompts" [paginator]="true" [rows]="rows" [totalRecords]="totalRecords" [lazy]="true" (onLazyLoad)="loadPrompts($event)" [loading]="loading" [sortField]="sortField" [sortOrder]="sortOrder" [globalFilterFields]="['promptCode','promptDesc','schema']" class="custom-table">
    <ng-template pTemplate="header">
        <tr>
            <th class="col-prompt-code">Prompt Code</th>
            <th class="col-text">Text</th>
            <th class="col-schema">Schema</th>
            <th class="col-actions">Actions</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-prompt>
        <tr>
            <td class="col-prompt-code">{{ prompt.promptCode }}</td>
            <td class="col-text">{{ prompt.promptDesc }}</td>
            <td class="col-schema">{{ prompt.schema }}</td>
            <td class="col-actions">
                <button pButton icon="pi pi-pencil" class="p-button-sm p-button-success p-button-text" (click)="showUpdateDialog(prompt)"></button>
                <button pButton icon="pi pi-trash" class="p-button-sm p-button-danger p-button-text" (click)="confirmDelete(prompt.id)"></button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="4" style="text-align: center;">No prompts found.</td>
        </tr>
    </ng-template>
</p-table>
