<div class="stats-container">
  <div class="stats-header">
    <h2 class="stats-title" translate>Candidate Statistics</h2>
    <p-card class="total-card">
      <div class="total-candidates">
        <span class="total-label" translate>Total Candidates:</span>
        <span class="candidate-count">{{ totalCandidates }}</span>
      </div>
    </p-card>
  </div>

  <p-tabView>
    <!-- Languages Tab -->
    <p-tabPanel [header]="'Languages' | translate">
      <p-card class="chart-card">
        <h3 translate>Candidates by Language</h3>
        <p-chart
          type="bar"
          [data]="languageChartData"
          [options]="chartOptions"
          height="300px">
        </p-chart>
      </p-card>
    </p-tabPanel>

    <!-- Skills Tab -->
    <p-tabPanel [header]="'Skills' | translate">
      <p-card class="chart-card">
        <h3 translate>Candidates by Skill</h3>
        <p-chart
          type="pie"
          [data]="skillsChartData"
          [options]="chartOptions"
          height="300px">
        </p-chart>
      </p-card>
    </p-tabPanel>
  </p-tabView>
</div>
