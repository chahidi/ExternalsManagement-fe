<p-toast></p-toast>
<p-dialog header="Update Prompt" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '50vw' }">
  <form *ngIf="dialogVisible">
    <div class="field">
      <label for="promptCode">Prompt Code</label>
      <input type="text" id="promptCode" pInputText [(ngModel)]="selectedPrompt.promptCode" name="promptCode" />
    </div>
    <div class="field">
      <label for="promptDesc">Text (Required)</label>
      <textarea id="promptDesc" pInputText pTextArea [(ngModel)]="selectedPrompt.promptDesc" name="promptDesc" required></textarea>
    </div>
    <div class="field">
      <label for="schema">Schema (JSON)</label>
      <textarea id="schema" pInputText pTextArea [(ngModel)]="selectedPrompt.schema" name="schema"></textarea>
    </div>
    <button pButton type="button" label="Update" (click)="updatePrompt()"></button>
  </form>
</p-dialog>

<p-table [value]="prompts" [paginator]="true" [rows]="rows" [totalRecords]="totalRecords" [lazy]="true" (onLazyLoad)="loadPrompts($event)" [loading]="loading" [sortField]="sortField" [sortOrder]="sortOrder" [globalFilterFields]="['promptCode','promptDesc','schema']">
  <ng-template pTemplate="header">
    <tr>
      <th>Prompt Code</th>
      <th>Text</th>
      <th>Schema</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-prompt>
    <tr>
      <td>{{ prompt.promptCode }}</td>
      <td>{{ prompt.promptDesc }}</td>
      <td>{{ prompt.schema }}</td>
      <td>
        <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="showUpdateDialog(prompt)"></button>
        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="deletePrompt(prompt.id)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
