<div class="stats-container">
  <div class="stats-header">
    <h2 class="stats-title">{{ 'stats.title' | translate }}</h2>
    <p-card class="total-card">
      <div class="total-candidates">
        <span class="total-label">{{ 'stats.totalCandidates' | translate }}</span>
        <span class="candidate-count">{{ totalCandidates }}</span>
      </div>
    </p-card>
  </div>

  <p-tabView>
    <!-- Languages Tab -->
    <p-tabPanel [header]="'stats.languagesTab' | translate">
      <p-card class="chart-card">
        <h3>{{ 'stats.candidatesByLanguage' | translate }}</h3>
        <p-chart
          type="bar"
          [data]="languageChartData"
          [options]="chartOptions"
          [style.height]="'300px'">
        </p-chart>
      </p-card>
    </p-tabPanel>

    <!-- Skills Tab -->
    <p-tabPanel [header]="'stats.skillsTab' | translate">
      <p-card class="chart-card">
        <h3>{{ 'stats.candidatesBySkill' | translate }}</h3>
        <p-chart
          type="pie"
          [data]="skillsChartData"
          [options]="chartOptions"
          [style.height]="'300px'">
        </p-chart>
      </p-card>
    </p-tabPanel>

    <!-- Experience Tab -->
    <p-tabPanel header="Experience">
      <p-card class="chart-card">
        <h3>Candidates by years of experience</h3>
        <p-chart
          type="bar"
          [data]="experienceChartData"
          [options]="chartOptions"
          height="300px">
        </p-chart>
      </p-card>
    </p-tabPanel>
  </p-tabView>
</div>
