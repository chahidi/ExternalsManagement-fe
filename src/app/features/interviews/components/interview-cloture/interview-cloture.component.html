<div class="thank-you-page">
    <!-- Animated Background -->
    <div class="background-container">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>

        <!-- Floating particles -->
        <div class="particles">
            <div class="particle" *ngFor="let i of [].constructor(30); let idx = index"></div>
        </div>

        <!-- Grid pattern -->
        <div class="grid-pattern"></div>
    </div>

    <!-- Main Content -->
    <div class="content-wrapper">
        <div class="thank-you-card">
            <!-- Status Icon Section -->
            <div class="status-section">
                <div class="icon-container">
                    <div class="pulse-ring"></div>
                    <div class="pulse-ring ring-2"></div>
                    <div class="pulse-ring ring-3"></div>
                    <div class="main-icon">
                        <i class="fas fa-check"></i>
                    </div>
                </div>
            </div>

            <!-- Message Section -->
            <div class="message-section">
                <div class="title-container">
                    <h1 class="thank-you-title">
                        <span class="title-word">Thank</span>
                        <span class="title-word">You!</span>
                    </h1>
                    <div class="title-underline"></div>
                </div>

                <p class="thank-you-description">You've successfully completed your interview. Your answers have been recorded and submitted for evaluation.</p>
            </div>
            <!-- Footer Section -->
            <div class="footer-section">
                <div class="footer-content">
                    <i class="fas fa-inbox"></i>
                    <div class="footer-text">
                        <span class="footer-title">Watch your inbox for updates</span>
                        <span class="footer-desc">Results will be sent to your registered email address</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
      <div class="copyright">
        <span>&copy; 2025 <strong>NTT DATA Morocco</strong></span>
    </div> .
    
</div>
